name: CI Tests

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:

  test-checker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: checker/requirements.txt

      - name: Install checker dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r checker/requirements.txt pytest

      - name: Run checker unit tests
        run: pytest checker/tests -q

  docker-publish:

    needs: test-checker
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

